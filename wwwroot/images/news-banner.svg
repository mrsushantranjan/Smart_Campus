<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="wave3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lightSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloomShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="240" rx="18" fill="url(#bgGrad)"/>

  <!-- Fluid 3D Wave Layers -->
  <g filter="url(#bloomShadow)">
    <!-- Base Wave Layer -->
    <path d="M 60 240 C 90 160 140 100 220 120 C 300 140 330 80 370 200 C 390 230 400 240 400 240 Z" fill="url(#wave3)" opacity="0.85"/>
    
    <!-- Central Swirl Petal -->
    <path d="M 120 240 C 110 130 180 60 250 80 C 320 100 350 160 380 240 Z" fill="url(#wave1)"/>
    
    <!-- Front Overlapping Crest -->
    <path d="M 160 240 C 150 160 210 110 270 130 C 330 150 340 210 360 240 Z" fill="url(#wave2)"/>
    
    <!-- Delicate Fluid Highlight Folds -->
    <path d="M 180 240 C 190 170 230 135 280 150 C 310 160 320 200 330 240 Z" fill="#60a5fa" opacity="0.7"/>
    <path d="M 210 240 C 220 190 250 160 290 175 C 310 185 315 215 320 240 Z" fill="#93c5fd" opacity="0.6"/>

    <!-- Light Highlights / Curves -->
    <path d="M 125 180 Q 200 80 260 90" stroke="url(#lightSheen)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 170 195 Q 230 120 280 138" stroke="url(#lightSheen)" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 220 210 Q 260 160 300 178" stroke="url(#lightSheen)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Orange Corner Ribbon -->
  <polygon points="0,0 80,0 0,80" fill="#f97316"/>
  <polygon points="0,0 72,0 0,72" fill="#ea580c"/>
  <text x="24" y="32" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff" transform="rotate(-45 24 32)">NOTICE</text>
</svg>
